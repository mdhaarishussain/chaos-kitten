remediation: |
  ## Java Deserialization Remediation
  
  ### 1. Avoid Java Native Serialization
  - Do not use `ObjectInputStream` for untrusted data
  - Consider using JSON, XML, or Protocol Buffers instead
  
  ### 2. Input Validation
  - Validate all serialized data before deserialization
  - Use allowlists for acceptable classes
  - Implement digital signatures for serialized data
  
  ### 3. Use Safe Libraries
  - Jackson: Disable default typing with `ObjectMapper.disableDefaultTyping()`
  - Fastjson: Use `ParserConfig.getGlobalInstance().setAutoTypeSupport(false)`
  - XStream: Use `XStream.addPermission(NoTypePermission.NONE)` and explicit allowlists
  
  ### 4. Class Filtering
  - Implement `ObjectInputFilter` (Java 9+) or `ValidatingObjectInputStream`
  - Use `SerialKiller` or similar filtering libraries
  
  ### 5. Network Segmentation
  - Isolate deserialization services
  - Use WAF rules to block serialized object patterns
  
  ### 6. Monitoring
  - Log deserialization attempts
  - Alert on suspicious patterns
  
  ### Example Secure Code:
  
  ```java
  // ❌ VULNERABLE - Never do this with untrusted data
  ObjectInputStream ois = new ObjectInputStream(inputStream);
  Object obj = ois.readObject();
  
  // ✅ SECURE - Use ObjectInputFilter (Java 9+)
  ObjectInputFilter filter = ObjectInputFilter.Config.createFilter(
      "maxdepth=5;java.base/*;!*"
  );
  ObjectInputStream ois = new ObjectInputStream(inputStream);
  ois.setObjectInputFilter(filter);
  Object obj = ois.readObject();
  
  // ✅ SECURE - Jackson with disabled default typing
  ObjectMapper mapper = new ObjectMapper();
  mapper.disableDefaultTyping();
  MyClass obj = mapper.readValue(json, MyClass.class);
  ```

